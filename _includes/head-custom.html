<style>
  h1, h2, h3 {
    color: rgb(246, 179, 49) !important;
  }
  h4, h5, h6 {
    color: rgb(210, 145, 20) !important;
  }
  p, li, td, th, blockquote, strong, em, small, span {
    color: #222 !important;
  }
  a, a:link, a:visited {
    color: #267CB9 !important;
  }
  a:hover {
    color: #069 !important;
  }
  header h1, header h1 a, header h2 a, header h3 a,
  header a[href], header p a, header .site-title a {
    color: rgb(246, 179, 49) !important;
  }
  .site-title, .site-title a, .header-heading a {
    color: rgb(246, 179, 49) !important;
  }
  /* This is a client instruction site, not a public source-code project. */
  .view {
    display: none;
  }

  /* SI4.0 navigation and dashboard styles */
  .si4-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 18px 0 26px;
    padding: 12px;
    background: #fff6dc;
    border: 1px solid #e7d8b5;
    border-radius: 10px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 3px 10px rgba(67,48,13,.08);
  }
  .si4-nav a, .si4-nav a:link, .si4-nav a:visited {
    display: inline-block;
    padding: 7px 10px;
    background: #fffdf7;
    border: 1px solid #d9bc73;
    border-radius: 6px;
    color: #222 !important;
    font-size: 0.9em;
    font-weight: 700;
    text-decoration: none;
  }
  .si4-nav a:hover { background: rgb(246, 179, 49); color: #222 !important; }
  .si4-hero {
    margin: 18px 0 28px;
    padding: 22px;
    background: linear-gradient(135deg, #fff6dc, #fffdf7);
    border: 1px solid #e7d8b5;
    border-radius: 12px;
  }
  .si4-hero h1 { margin: 0 0 8px; }
  .si4-deadline { font-size: 1.1em; font-weight: 700; }
  .si4-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
    margin: 20px 0 28px;
  }
  .si4-card {
    display: block;
    padding: 16px;
    background: #fffdf7;
    border: 1px solid #e7d8b5;
    border-radius: 10px;
    color: #222 !important;
    text-decoration: none;
  }
  .si4-card:hover { border-color: rgb(210, 145, 20); box-shadow: 0 4px 14px rgba(67,48,13,.12); }
  .si4-card strong { display: block; margin-bottom: 5px; color: rgb(210, 145, 20) !important; }
  .si4-card span { font-size: 0.9em; }
  .si4-callout { margin: 20px 0; padding: 14px 16px; background: #fff6dc; border-left: 5px solid rgb(246, 179, 49); }
  .si4-next { margin: 28px 0; text-align: right; }
  .si4-next a, .si4-next a:link, .si4-next a:visited {
    display: inline-block;
    padding: 11px 16px;
    background: rgb(246, 179, 49);
    border-radius: 7px;
    color: #222 !important;
    font-weight: 700;
    text-decoration: none;
  }
  .si4-next a:hover { background: rgb(210, 145, 20); }
  @media (max-width: 640px) { .si4-nav { gap: 6px; padding: 9px; } .si4-nav a { font-size: 0.82em; padding: 6px 8px; } .si4-hero { padding: 17px; } }

  /* Copy button styles */
  .copy-container {
    border: 1px solid #ddd;
    border-radius: 6px;
    overflow: hidden;
    margin: 20px 0;
  }
  .copy-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f5f5f5;
    padding: 8px 14px;
    border-bottom: 1px solid #ddd;
  }
  .copy-header span {
    font-size: 0.85em;
    color: #666 !important;
    font-weight: 600;
  }
  .copy-btn {
    background: rgb(246, 179, 49);
    color: #222 !important;
    border: none;
    padding: 6px 16px;
    border-radius: 4px;
    font-size: 0.85em;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
  }
  .copy-btn:hover {
    background: rgb(210, 145, 20);
  }
  .copy-btn.copied {
    background: #2ecc71;
    color: #fff !important;
  }
  .copy-text {
    width: 100%;
    min-height: 200px;
    padding: 14px;
    border: none;
    background: #fff;
    font-family: monospace;
    font-size: 0.82em;
    line-height: 1.6;
    color: #222;
    resize: vertical;
    box-sizing: border-box;
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.copy-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var container = this.closest('.copy-container');
      var textarea = container.querySelector('.copy-text');
      textarea.select();
      textarea.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(textarea.value).then(function() {
        var originalText = this.textContent;
        this.textContent = '✓ Copiato!';
        this.classList.add('copied');
        var self = this;
        setTimeout(function() {
          self.textContent = originalText;
          self.classList.remove('copied');
        }, 2000);
      }.bind(this));
    });
  });
});
</script>
